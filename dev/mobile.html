<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Mobil görünüm (yalnızca geliştirme)</title>
    <style>
      /* README için iki telefon çerçevesinde mobil görünüm. Derlemeye girmez. */
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center; gap: 72px;
        background: #eceeec;
      }
      .phone {
        padding: 10px; border-radius: 48px;
        background: #1c1f1e;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      }
      iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 38px; background: #fff; }
    </style>
  </head>
  <body>
    <div class="phone"><iframe src="/?theme=light&landing=1&demo=x"></iframe></div>
    <div class="phone"><iframe src="/?demo=Kamp%20Ekibi&me=Selin&theme=dark&scroll=Kamp%20listesi"></iframe></div>
  </body>

name: Release

# "v1.2.3" biçiminde bir etiket gönderildiğinde derler ve index.html dosyasını
# o sürümün Releases sayfasına ekler.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: CSP derlemede mevcut mu?
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Derlemede ağ çağrısı yok mu?
        run: "! grep -q 'fetch(' dist/index.html"
      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/index.html \
            --title "$TAG" \
            --notes "İndir: aşağıdaki **index.html** dosyasını indirip çift tıklayarak aç, ardından WhatsApp zip dosyanı sayfaya bırak. İnternet bağlantısı gerekmez."

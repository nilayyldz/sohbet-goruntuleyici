name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:prod
      - run: npm run build
      - name: CSP derlemede mevcut mu?
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Derlemede ağ çağrısı yok mu?
        run: "! grep -q 'fetch(' dist/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: sohbet-goruntuleyici
          path: dist/index.html

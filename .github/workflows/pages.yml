name: GitHub Pages

# Uygulamayı https://<kullanıcı>.github.io/<depo>/ adresinde yayınlar.
# Ücretsiz hesapta Pages yalnızca public depolarda çalışır; depo private iken iş atlanır.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: CSP derlemede mevcut mu?
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Derlemede ağ çağrısı yok mu?
        run: "! grep -q 'fetch(' dist/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
